name: Build Slippi Renderer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        default: headless-egl
        required: true
      build_jobs:
        description: Parallel compiler jobs
        default: "4"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      IMAGE_NAME: ghcr.io/dhruvbhatia0/smash-slippi-renderer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push renderer image
        uses: docker/build-push-action@v6
        with:
          context: experiments_dump
          file: experiments_dump/fast_replay_probe/Dockerfile.headless-egl
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.tag }}
          build-args: |
            BUILD_JOBS=${{ inputs.build_jobs }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
